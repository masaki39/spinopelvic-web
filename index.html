<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spinopelvic Analyzer (Web)</title>
<style>
  :root { --bg:#1e1e1e; --panel:#f4f4f5; --accent:#1565c0; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family: system-ui, "Hiragino Sans", sans-serif; }
  body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  #toolbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center;
             padding:6px 8px; background:var(--bg); color:#fff; }
  #toolbar button { font-size:12px; padding:5px 9px; border:0; border-radius:5px;
                    background:#3a3a3a; color:#fff; cursor:pointer; }
  #toolbar button:hover { background:#505050; }
  #toolbar button:disabled { opacity:.4; cursor:default; }
  #toolbar .sep { width:1px; height:22px; background:#555; margin:0 3px; }
  #toolbar .accent { background:var(--accent); }
  #toolbar .teal { background:#00897b; }
  #toolbar .orange { background:#ef6c00; }
  #toolbar label { font-size:12px; display:flex; align-items:center; gap:4px; }
  #toolbar input[type=text] { font-size:12px; padding:4px 6px; border-radius:4px; border:1px solid #777;
                              background:#2a2a2a; color:#fff; width:120px; }
  #counter { font-size:12px; color:#bbb; margin-left:auto; }
  #main { flex:1; display:flex; min-height:0; }
  #stage { flex:1; position:relative; background:#222; min-width:0; }
  #canvas { width:100%; height:100%; display:block; cursor:crosshair; touch-action:none; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
           color:#888; font-size:15px; pointer-events:none; }
  #sidebar { width:300px; background:var(--panel); padding:12px; overflow:auto; }
  #sidebar h3 { margin:0 0 6px; font-size:13px; }
  .metrics { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .metric { background:#fff; border-radius:8px; padding:10px; text-align:center; box-shadow:0 1px 3px #0002; }
  .metric .k { font-weight:700; font-size:12px; color:#555; }
  .metric .v { font-size:20px; font-weight:700; }
  .note { font-size:11px; color:#666; line-height:1.5; }
  #status { padding:5px 10px; background:#fffbe6; border-top:1px solid #eedc82; font-size:12px;
            font-weight:600; }
  #help { position:absolute; inset:0; background:#000a; color:#fff; padding:24px; overflow:auto;
          display:none; font-size:13px; line-height:1.7; }
  #help.show { display:block; }
  #help h2 { margin-top:0; }
  #help kbd { background:#333; border:1px solid #666; border-radius:4px; padding:1px 6px; font-family:monospace; }
  #help table { border-collapse:collapse; }
  #help td { padding:3px 14px 3px 0; vertical-align:top; }
  .scalebox { margin-top:10px; padding:8px; border-radius:6px; font-size:12px; }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="btnOpen">画像を開く (O)</button>
    <button class="dataonly" id="btnRotL">⟲ 左90 (⇧R)</button>
    <button class="dataonly" id="btnRotR">⟳ 右90 (R)</button>
    <button class="dataonly" id="btnFlip">左右反転 (F)</button>
    <span class="sep"></span>
    <button class="dataonly orange" id="btnScale">スケール校正 (S)</button>
    <button class="dataonly teal" id="btnC7">C7入力 / SVA (C)</button>
    <button class="dataonly" id="btnUndo">取消 (Z)</button>
    <span class="sep"></span>
    <button class="dataonly accent" id="btnRecord">記録して次へ (Enter)</button>
    <button class="dataonly" id="btnPrev">前 (P)</button>
    <button class="dataonly" id="btnNext">次 (N)</button>
    <span class="sep"></span>
    <button id="btnCsv">CSV保存 (D)</button>
    <label><input type="checkbox" id="chkPer"> 1枚ごとDL</label>
    <label><input type="checkbox" id="chkScale"> スケール維持</label>
    <span class="sep"></span>
    <label>ID <input type="text" id="caseId" placeholder="case001"></label>
    <button id="btnHelp">? ヘルプ</button>
    <span id="counter">画像なし</span>
  </div>

  <div id="main">
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="empty">画像を開く（複数選択・フォルダのドラッグ&ドロップ可）</div>
      <div id="help"></div>
    </div>
    <div id="sidebar">
      <h3>計測値</h3>
      <div class="metrics" id="metrics"></div>
      <div id="svaInfo" class="note" style="margin-top:8px"></div>
      <div id="scaleInfo" class="scalebox"></div>
      <h3 style="margin-top:16px">定義</h3>
      <div class="note">
        PI: S1終板の垂線と寛骨臼軸線の角度<br>
        PT: 寛骨臼軸線と鉛直線の角度<br>
        SS: S1終板と水平線の角度<br>
        LL: L1終板とS1終板のCobb角<br>
        SVA: C7中点とS1後縁の水平距離
      </div>
      <div class="note" style="margin-top:12px;color:#999">
        画像は端末外に送信されません（ローカル処理）。
      </div>
    </div>
  </div>
  <div id="status">画像を開いてください</div>

  <input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<script>
"use strict";
//==================================================================
// 幾何ユーティリティ（Flutter版 main.dart:800-883 の厳密移植）
//==================================================================
const G = {
  midpoint:(a,b)=>({x:(a.x+b.x)/2, y:(a.y+b.y)/2}),
  distance:(a,b)=>Math.hypot(a.x-b.x, a.y-b.y),
  acuteAngle(v1,v2){
    const n1=Math.hypot(v1.x,v1.y), n2=Math.hypot(v2.x,v2.y);
    if(n1===0||n2===0) return 0;
    let c=(v1.x*v2.x+v1.y*v2.y)/(n1*n2);
    c=Math.min(1,Math.max(-1,c));
    let a=Math.acos(c)*180/Math.PI;
    if(a>90) a=180-a;
    return a;
  },
  lineAngle:(a,b)=>Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI,
  normAngle180(a){ while(a<=-180)a+=360; while(a>180)a-=360; return a; },
  cobbAngle(p1,p2,p3,p4){
    const a1=G.lineAngle(p1,p2), a2=G.lineAngle(p3,p4);
    let d=Math.abs(G.normAngle180(a1-a2));
    if(d>180) d=360-d;
    if(d>90)  d=180-d;
    return d;
  },
};

//==================================================================
// プリセット（汎用化の核：ランドマーク・計測・描画・CSVを内包）
//==================================================================
const SPINOPELVIC = {
  id:'spinopelvic',
  required:['femL','femR','s1a','s1p','l1a','l1p'],
  steps:[
    {id:'femL', label:'左大腿骨頭中心', color:'#ff5252'},
    {id:'femR', label:'右大腿骨頭中心', color:'#ff5252'},
    {id:'s1a',  label:'S1 前縁',       color:'#ffeb3b'},
    {id:'s1p',  label:'S1 後縁',       color:'#ffeb3b'},
    {id:'l1a',  label:'L1 前縁',       color:'#ff9800'},
    {id:'l1p',  label:'L1 後縁',       color:'#ff9800'},
    {id:'c7a',  label:'C7 前縁',       color:'#b2ff59', optional:true},
    {id:'c7p',  label:'C7 後縁',       color:'#b2ff59', optional:true},
  ],
  metrics:[
    {key:'PI', unit:'°'}, {key:'PT', unit:'°'},
    {key:'SS', unit:'°'}, {key:'LL', unit:'°'},
  ],
  compute(P, pxPerMm){
    if(!(P.femL&&P.femR&&P.s1a&&P.s1p&&P.l1a&&P.l1p)) return null;
    const hipAxis=G.midpoint(P.femL,P.femR);
    const s1Mid=G.midpoint(P.s1a,P.s1p);
    const s1Vec={x:P.s1p.x-P.s1a.x, y:P.s1p.y-P.s1a.y};
    let n={x:-s1Vec.y, y:s1Vec.x};
    const nn=Math.hypot(n.x,n.y);
    if(nn>0) n={x:n.x/nn, y:n.y/nn};
    if(n.y<0) n={x:-n.x, y:-n.y};
    const pelvis={x:hipAxis.x-s1Mid.x, y:hipAxis.y-s1Mid.y};
    const PI=G.acuteAngle(pelvis, n);
    const PT=G.acuteAngle(pelvis, {x:0,y:-1});
    const SS=G.acuteAngle(s1Vec, {x:1,y:0});
    const LL=G.cobbAngle(P.l1a,P.l1p,P.s1a,P.s1p);
    let svaPx=null, svaMm=null, c7Mid=null;
    if(P.c7a&&P.c7p){
      c7Mid=G.midpoint(P.c7a,P.c7p);
      svaPx=c7Mid.x-P.s1p.x;
      if(pxPerMm&&pxPerMm>0) svaMm=svaPx/pxPerMm;
    }
    return {PI,PT,SS,LL,svaPx,svaMm,hipAxis,s1Mid,s1Normal:n,c7Mid};
  },
  csvColumns:[
    'patient_id','image_name','saved_at',
    'PI_deg','PT_deg','SS_deg','LL_deg','SVA_px','SVA_mm',
    'scale_px_per_mm','scale_real_mm',
    'scale_p1_x','scale_p1_y','scale_p2_x','scale_p2_y',
    'left_femoral_x','left_femoral_y','right_femoral_x','right_femoral_y',
    'common_femoral_radius',
    'S1_anterior_x','S1_anterior_y','S1_posterior_x','S1_posterior_y',
    'L1_anterior_x','L1_anterior_y','L1_posterior_x','L1_posterior_y',
    'C7_anterior_x','C7_anterior_y','C7_posterior_x','C7_posterior_y',
  ],
  csvRow(st, res){
    const f=(v,d=2)=>(v==null||Number.isNaN(v))?'':(+v).toFixed(d);
    const P=st.points, sc=st.scale;
    return [
      st.caseId, st.currentName||'', timestamp(),
      f(res.PI),f(res.PT),f(res.SS),f(res.LL),f(res.svaPx),f(res.svaMm),
      f(sc.pxPerMm,4),f(sc.realMm),
      f(sc.p1&&sc.p1.x),f(sc.p1&&sc.p1.y),f(sc.p2&&sc.p2.x),f(sc.p2&&sc.p2.y),
      f(P.femL&&P.femL.x),f(P.femL&&P.femL.y),f(P.femR&&P.femR.x),f(P.femR&&P.femR.y),
      f(st.radius),
      f(P.s1a&&P.s1a.x),f(P.s1a&&P.s1a.y),f(P.s1p&&P.s1p.x),f(P.s1p&&P.s1p.y),
      f(P.l1a&&P.l1a.x),f(P.l1a&&P.l1a.y),f(P.l1p&&P.l1p.x),f(P.l1p&&P.l1p.y),
      f(P.c7a&&P.c7a.x),f(P.c7a&&P.c7a.y),f(P.c7p&&P.c7p.x),f(P.c7p&&P.c7p.y),
    ];
  },
};

//==================================================================
// 状態
//==================================================================
const state = {
  preset: SPINOPELVIC,
  images: [],            // {file, name}
  index: -1,
  currentName: '',
  base: null,            // 元画像 (ImageBitmap)
  bitmap: null,          // 回転/反転適用後 (canvas)
  imgW:0, imgH:0,
  rotation:0, flipH:false,
  points:{},             // id -> {x,y}
  placedOrder:[],
  radius:60,
  active:null,
  placingC7:false,
  scale:{ p1:null, p2:null, realMm:null, pxPerMm:null, setting:0 },
  caseId:'',
  rows:[],
  rowByIndex:{},          // 画像index -> rows内の位置（同じ画像の重複記録を防ぐ）
  dirty:false,            // 未記録の変更があるか
  keepScale:false,        // バッチでスケール校正を次画像へ維持
  result:null,
  view:{ scale:1, ox:0, oy:0 },
  mouseImg:null,
  out:{ perImage:false },
};

//==================================================================
// DOM参照
//==================================================================
const $ = id=>document.getElementById(id);
const canvas=$('canvas'), ctx=canvas.getContext('2d');
const fileInput=$('fileInput');

//==================================================================
// 座標変換
//==================================================================
const toScreen = p=>({x:p.x*state.view.scale+state.view.ox, y:p.y*state.view.scale+state.view.oy});
const toImg    = s=>({x:(s.x-state.view.ox)/state.view.scale, y:(s.y-state.view.oy)/state.view.scale});

//==================================================================
// 画像読み込み・回転
//==================================================================
function setFiles(files){
  const imgs=[...files].filter(f=>f.type.startsWith('image/'))
                       .sort((a,b)=>a.name.localeCompare(b.name, undefined, {numeric:true}));
  if(!imgs.length) return;
  state.images=imgs.map(f=>({file:f, name:f.name}));
  state.rows=[]; state.rowByIndex={};   // 新しいバッチ＝記録をリセット
  loadImage(0);
}

let _loadToken=0;
async function loadImage(i){
  if(i<0||i>=state.images.length) return;
  const token=++_loadToken;
  const it=state.images[i];
  const prevScale = state.keepScale ? {...state.scale} : null;
  const base=await createImageBitmap(it.file);
  if(token!==_loadToken) return;        // 連打で追い越された読み込みは破棄
  state.index=i; state.currentName=it.name; state.base=base;
  state.rotation=0; state.flipH=false;
  buildWorking();
  resetPoints();
  if(prevScale && prevScale.pxPerMm){ state.scale={...prevScale, setting:0}; recompute(); }
  $('caseId').value = state.caseId = deriveId(it.name);
  fit(); updateUI(); render();
}

function deriveId(name){ return name.replace(/\.[^.]+$/,''); }

function buildWorking(){
  const r=((state.rotation%360)+360)%360;
  const swap=(r===90||r===270);
  const bw=state.base.width, bh=state.base.height;
  const w=swap?bh:bw, h=swap?bw:bh;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  x.save();
  x.translate(w/2,h/2);
  x.rotate(r*Math.PI/180);
  if(state.flipH) x.scale(-1,1);
  x.drawImage(state.base, -bw/2, -bh/2);
  x.restore();
  state.bitmap=c; state.imgW=w; state.imgH=h;
}

function resetPoints(){
  state.points={}; state.placedOrder=[]; state.radius=60;
  state.active=null; state.placingC7=false; state.result=null; state.dirty=false;
  state.scale={ p1:null, p2:null, realMm:null, pxPerMm:null, setting:0 };
}

function rotate(deg){
  if(!state.base) return;
  if(hasUnsaved() && !confirm('回転すると配置済みの点・スケールが失われます。続けますか？')) return;
  state.rotation+=deg; buildWorking(); resetPoints(); fit(); recompute(); updateUI(); render();
}
function flip(){
  if(!state.base) return;
  if(hasUnsaved() && !confirm('反転すると配置済みの点・スケールが失われます。続けますか？')) return;
  state.flipH=!state.flipH; buildWorking(); resetPoints(); fit(); recompute(); updateUI(); render();
}

//==================================================================
// ビュー（フィット・ズーム・パン）
//==================================================================
function fit(){
  const cw=canvas.clientWidth, ch=canvas.clientHeight;
  if(!state.imgW) return;
  const s=Math.min(cw/state.imgW, ch/state.imgH)*0.98;
  state.view.scale=s;
  state.view.ox=(cw-state.imgW*s)/2;
  state.view.oy=(ch-state.imgH*s)/2;
}
function zoomAt(sx,sy,factor){
  const v=state.view;
  const ix=(sx-v.ox)/v.scale, iy=(sy-v.oy)/v.scale;
  v.scale=Math.max(0.05, Math.min(40, v.scale*factor));
  v.ox=sx-ix*v.scale; v.oy=sy-iy*v.scale;
  render();
}

//==================================================================
// 計測・記録
//==================================================================
function recompute(){ state.result=state.preset.compute(state.points, state.scale.pxPerMm); }
function recalcScale(){
  const sc=state.scale;
  if(sc.p1&&sc.p2&&sc.realMm) sc.pxPerMm=G.distance(sc.p1,sc.p2)/sc.realMm;
}
function pendingStepId(){
  for(const id of state.preset.required) if(!state.points[id]) return id;
  if(state.placingC7){ if(!state.points.c7a) return 'c7a'; if(!state.points.c7p) return 'c7p'; }
  return null;
}
const labelOf = id => (state.preset.steps.find(s=>s.id===id)||{}).label||id;

function place(id, p){
  state.points[id]=p; state.placedOrder.push(id); state.active=id; state.dirty=true;
  if(id==='femR'&&state.points.femL){
    const est=G.distance(state.points.femL, state.points.femR)/4;
    state.radius=Math.max(20, Math.min(120, est));
  }
  if(id==='c7p') state.placingC7=false;
  recompute();
}
function undo(){
  const id=state.placedOrder.pop();
  if(!id) return;
  delete state.points[id];
  if(id==='c7a'||id==='c7p') state.placingC7=false;
  state.active=state.placedOrder[state.placedOrder.length-1]||null;
  state.dirty=true; recompute(); updateUI(); render();
}

function hasUnsaved(){ return state.dirty && state.placedOrder.length>0; }
function navTo(i){
  if(i<0||i>=state.images.length) return;
  if(hasUnsaved() && !confirm('未記録の変更があります。記録せずに移動しますか？')) return;
  loadImage(i);
}

async function recordAndNext(){
  recompute();
  if(!state.result){ setStatus('必須点（大腿骨頭L/R・S1・L1）が未配置です'); return; }
  state.caseId=$('caseId').value.trim();
  const row=state.preset.csvRow(state, state.result);
  const pos=state.rowByIndex[state.index];
  if(pos!==undefined){ state.rows[pos]=row; }          // 同じ画像の再記録は置換
  else { state.rowByIndex[state.index]=state.rows.length; state.rows.push(row); }
  state.dirty=false;
  const base=(state.caseId||state.currentName||'case').replace(/[\\/:*?"<>| ]/g,'_');

  if(state.out.perImage){
    download(csvBlob([row]), base+'.csv');
    download(await canvasBlob(), base+'.png');
  }

  if(state.index < state.images.length-1){
    loadImage(state.index+1);
  }else{
    setStatus('全画像の記録完了（計 '+state.rows.length+' 件）。CSV保存(D)で書き出せます。');
    updateUI();
  }
}

//==================================================================
// CSV / ファイル出力
//==================================================================
function timestamp(){
  const n=new Date(), p=(v,l=2)=>String(v).padStart(l,'0');
  return `${p(n.getFullYear(),4)}-${p(n.getMonth()+1)}-${p(n.getDate())} `+
         `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}
function fileStamp(){
  const n=new Date(), p=(v,l=2)=>String(v).padStart(l,'0');
  return `${p(n.getFullYear(),4)}${p(n.getMonth()+1)}${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}`;
}
const csvEsc = v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
function csvText(rows){
  return [state.preset.csvColumns, ...rows].map(r=>r.map(csvEsc).join(',')).join('\r\n');
}
function csvBlob(rows){ return new Blob(['﻿'+csvText(rows)], {type:'text/csv;charset=utf-8'}); }
function download(blob, name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function saveCsv(){
  if(!state.rows.length){ setStatus('記録がありません（Enterで記録してから保存）'); return; }
  download(csvBlob(state.rows), `spinopelvic_batch_${fileStamp()}.csv`);
}
function canvasBlob(){
  return new Promise(res=>renderToImageCanvas().toBlob(res,'image/png'));
}

//==================================================================
// 描画
//==================================================================
function render(){
  const dpr=window.devicePixelRatio||1;
  const cw=canvas.clientWidth, ch=canvas.clientHeight;
  if(canvas.width!==cw*dpr||canvas.height!==ch*dpr){ canvas.width=cw*dpr; canvas.height=ch*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  if(!state.bitmap) return;
  const v=state.view;
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(state.bitmap, v.ox, v.oy, state.imgW*v.scale, state.imgH*v.scale);
  paintOverlay(ctx, toScreen, v.scale, 2);
  drawLoupe(ctx, cw);
}

// 画像解像度でのレンダリング（PNG出力用）
function renderToImageCanvas(){
  const c=document.createElement('canvas'); c.width=state.imgW; c.height=state.imgH;
  const x=c.getContext('2d');
  x.drawImage(state.bitmap,0,0);
  paintOverlay(x, p=>({x:p.x,y:p.y}), 1, 2);
  return x.canvas;
}

// map: 画像座標→描画座標、ds: 画像長さの倍率、lw: 線幅
function paintOverlay(g, map, ds, lw){
  const P=state.points, res=state.result, sc=state.scale;
  const line=(a,b,color,w)=>{ g.strokeStyle=color; g.lineWidth=w||lw; const A=map(a),B=map(b);
    g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(B.x,B.y); g.stroke(); };
  const dot=(p,r,color)=>{ const c=map(p); g.fillStyle=color; g.beginPath(); g.arc(c.x,c.y,r,0,7); g.fill(); };
  const ring=(p,r,color,w)=>{ const c=map(p); g.strokeStyle=color; g.lineWidth=w||lw;
    g.beginPath(); g.arc(c.x,c.y,r,0,7); g.stroke(); };
  const cross=(p,color)=>{ const c=map(p); g.strokeStyle=color; g.lineWidth=lw;
    g.beginPath(); g.moveTo(c.x-8,c.y); g.lineTo(c.x+8,c.y); g.moveTo(c.x,c.y-8); g.lineTo(c.x,c.y+8); g.stroke(); };
  const label=(p,t,color,dx=8,dy=-8)=>{ const c=map(p); g.font='12px system-ui'; g.textBaseline='bottom';
    const w=g.measureText(t).width; g.fillStyle='rgba(0,0,0,.65)'; g.fillRect(c.x+dx-2,c.y+dy-12,w+4,15);
    g.fillStyle=color; g.fillText(t,c.x+dx,c.y+dy); };

  // スケール
  if(sc.p1){ dot(sc.p1,5,'#ff9800'); ring(sc.p1,5,'#fff',1.5); }
  if(sc.p2){ dot(sc.p2,5,'#ff9800'); ring(sc.p2,5,'#fff',1.5); }
  if(sc.p1&&sc.p2){
    line(sc.p1,sc.p2,'#ff9800',2.5);
    const mid={x:(sc.p1.x+sc.p2.x)/2,y:(sc.p1.y+sc.p2.y)/2};
    const px=G.distance(sc.p1,sc.p2);
    label(mid, sc.realMm? `${sc.realMm.toFixed(1)}mm (${px.toFixed(0)}px)`:`${px.toFixed(0)}px`, '#ffb74d', 0,-6);
  }

  // 大腿骨頭
  const femHead=(c)=>{
    ring(c, state.radius*ds, '#4caf50', 2);
    cross(c,'#ff5252');
    const handle={x:c.x+state.radius, y:c.y};
    dot(handle,6,'#fff'); ring(handle,6,'#4caf50',1.5);
  };
  if(P.femL) femHead(P.femL);
  if(P.femR) femHead(P.femR);

  // S1/L1
  const sp=[['s1a','S1前','#ffeb3b'],['s1p','S1後','#ffeb3b'],['l1a','L1前','#ff9800'],['l1p','L1後','#ff9800']];
  for(const [id,t,col] of sp){ if(P[id]){ dot(P[id],6,col); label(P[id],t,col); } }
  if(P.s1a&&P.s1p) line(P.s1a,P.s1p,'#00e5ff',2);
  if(P.l1a&&P.l1p) line(P.l1a,P.l1p,'#ff9800',2);

  // C7
  if(P.c7a){ dot(P.c7a,6,'#b2ff59'); label(P.c7a,'C7前','#b2ff59'); }
  if(P.c7p){ dot(P.c7p,6,'#b2ff59'); label(P.c7p,'C7後','#b2ff59'); }
  if(P.c7a&&P.c7p) line(P.c7a,P.c7p,'#b2ff59',2);

  // 計測補助線
  if(res){
    dot(res.hipAxis,5,'#ab47bc'); dot(res.s1Mid,5,'#fff');
    line(res.hipAxis,res.s1Mid,'#ab47bc',2);
    const end={x:res.s1Mid.x+res.s1Normal.x*180, y:res.s1Mid.y+res.s1Normal.y*180};
    line(res.s1Mid,end,'#fff',2);
    if(res.c7Mid&&P.s1p){
      line(res.c7Mid,{x:res.c7Mid.x,y:P.s1p.y},'#b2ff59',2.5);
      dashed(g,map,{x:P.s1p.x,y:P.s1p.y},{x:res.c7Mid.x,y:P.s1p.y},'#b2ff59',1.5);
      const lab = res.svaMm!=null? `SVA ${res.svaMm.toFixed(1)}mm`:`SVA ${res.svaPx.toFixed(1)}px`;
      label({x:(P.s1p.x+res.c7Mid.x)/2,y:P.s1p.y}, lab, '#b2ff59', 0, 16);
    }
  }

  // アクティブ点ハイライト
  if(state.active&&P[state.active]) ring(P[state.active], 11, '#fff', 2);
}

function dashed(g,map,a,b,color,w){
  const A=map(a),B=map(b); g.strokeStyle=color; g.lineWidth=w; g.setLineDash([8,4]);
  g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(B.x,B.y); g.stroke(); g.setLineDash([]);
}

function drawLoupe(g, cw){
  if(!state.mouseImg) return;
  const z=4, size=150, pad=10;
  const dx=cw-size-pad, dy=pad;
  const sw=size/z, sh=size/z;
  const sx=state.mouseImg.x-sw/2, sy=state.mouseImg.y-sh/2;
  g.save();
  g.beginPath(); g.rect(dx,dy,size,size); g.clip();
  g.fillStyle='#000'; g.fillRect(dx,dy,size,size);
  g.imageSmoothingEnabled=false;
  g.drawImage(state.bitmap, sx,sy,sw,sh, dx,dy,size,size);
  // ルーペ内のランドマーク
  const lm=p=>({x:dx+(p.x-sx)/sw*size, y:dy+(p.y-sy)/sh*size});
  for(const s of state.preset.steps){ const p=state.points[s.id]; if(p){
    const c=lm(p); g.fillStyle=s.color; g.beginPath(); g.arc(c.x,c.y,4,0,7); g.fill(); } }
  g.restore();
  // 中心十字 + 枠
  g.strokeStyle='#f44'; g.lineWidth=1;
  g.beginPath(); g.moveTo(dx+size/2-10,dy+size/2); g.lineTo(dx+size/2+10,dy+size/2);
  g.moveTo(dx+size/2,dy+size/2-10); g.lineTo(dx+size/2,dy+size/2+10); g.stroke();
  g.strokeStyle='#fff'; g.lineWidth=1.5; g.strokeRect(dx,dy,size,size);
  g.fillStyle='#fff'; g.font='10px system-ui'; g.textBaseline='top';
  g.fillText(`${z}x`, dx+4, dy+4);
}

//==================================================================
// ヒットテスト・ポインタ操作
//==================================================================
function hitTest(sp){
  const thr=10, P=state.points;
  for(const [id,center] of [['femL',P.femL],['femR',P.femR]]){
    if(!center) continue;
    const h=toScreen({x:center.x+state.radius, y:center.y});
    if(Math.hypot(sp.x-h.x,sp.y-h.y)<thr) return {type:id==='femL'?'radiusL':'radiusR'};
  }
  for(const s of state.preset.steps){ const p=P[s.id]; if(!p) continue;
    const c=toScreen(p); if(Math.hypot(sp.x-c.x,sp.y-c.y)<thr) return {type:'point', id:s.id}; }
  for(const [id,p] of [['scale1',state.scale.p1],['scale2',state.scale.p2]]){ if(!p) continue;
    const c=toScreen(p); if(Math.hypot(sp.x-c.x,sp.y-c.y)<thr) return {type:id}; }
  return null;
}
function applyDrag(hit, ip){
  const P=state.points, sc=state.scale;
  state.dirty=true;
  switch(hit.type){
    case 'point': P[hit.id]=ip; state.active=hit.id; break;
    case 'radiusL': if(P.femL) state.radius=Math.max(10,G.distance(ip,P.femL)); break;
    case 'radiusR': if(P.femR) state.radius=Math.max(10,G.distance(ip,P.femR)); break;
    case 'scale1': sc.p1=ip; recalcScale(); break;
    case 'scale2': sc.p2=ip; recalcScale(); break;
  }
  recompute();
}
function scaleTap(ip){
  const sc=state.scale;
  if(sc.setting===1){ sc.p1=ip; sc.setting=2; setStatus('スケール: 基準線の終点をクリック'); }
  else if(sc.setting===2){
    sc.p2=ip; sc.setting=0;
    const v=prompt('基準線の実長 (mm) を入力', '100');
    const mm=parseFloat(v);
    if(mm>0){ sc.realMm=mm; recalcScale(); state.dirty=true; setStatus(`スケール設定: 1mm = ${sc.pxPerMm.toFixed(2)}px`); }
    else { sc.p1=null; sc.p2=null; setStatus('スケール校正をキャンセルしました'); }
    recompute();
  }
}
function placeOrSelect(ip){
  const pid=pendingStepId();
  if(pid){ place(pid, ip); return; }
  // 最近傍点を選択
  let best=null, bd=20;
  for(const s of state.preset.steps){ const p=state.points[s.id]; if(!p) continue;
    const c=toScreen(p), d=Math.hypot(c.x-toScreen(ip).x, c.y-toScreen(ip).y); if(d<bd){ bd=d; best=s.id; } }
  if(best) state.active=best;
}

let down=null;
canvas.addEventListener('pointerdown', e=>{
  if(!state.bitmap) return;
  canvas.setPointerCapture(e.pointerId);
  const sp={x:e.offsetX,y:e.offsetY};
  down={sx:sp.x, sy:sp.y, hit:hitTest(sp), moved:0, ox:state.view.ox, oy:state.view.oy};
});
canvas.addEventListener('pointermove', e=>{
  const sp={x:e.offsetX,y:e.offsetY};
  if(state.bitmap) state.mouseImg=toImg(sp);
  if(down){
    const dx=sp.x-down.sx, dy=sp.y-down.sy;
    down.moved=Math.max(down.moved, Math.hypot(dx,dy));
    if(down.hit) applyDrag(down.hit, toImg(sp));
    else if(down.moved>=5){ state.view.ox=down.ox+dx; state.view.oy=down.oy+dy; }
  }
  render();
  if(down) updateUI();
});
canvas.addEventListener('pointerup', e=>{
  if(!down) return;
  const sp={x:e.offsetX,y:e.offsetY}, ip=toImg(sp), tap=down.moved<5;
  if(state.scale.setting>0 && tap) scaleTap(ip);
  else if(tap){
    if(down.hit&&down.hit.type==='point') state.active=down.hit.id;
    else if(!down.hit) placeOrSelect(ip);
  }
  down=null; updateUI(); render();
});
canvas.addEventListener('pointerleave', ()=>{ state.mouseImg=null; render(); });
canvas.addEventListener('wheel', e=>{ if(!state.bitmap) return; e.preventDefault();
  zoomAt(e.offsetX, e.offsetY, e.deltaY<0?1.1:1/1.1); }, {passive:false});

//==================================================================
// キーボード
//==================================================================
function nudge(dx,dy){
  if(!state.active||!state.points[state.active]) return;
  const p=state.points[state.active]; p.x+=dx; p.y+=dy; state.dirty=true; recompute(); updateUI(); render();
}
window.addEventListener('keydown', e=>{
  const inField = document.activeElement && document.activeElement.tagName==='INPUT';
  if(inField){ if(e.key==='Escape') document.activeElement.blur(); else return; }
  if(e.metaKey||e.ctrlKey) return;        // ブラウザのCmd/Ctrlショートカットを優先
  if($('help').classList.contains('show')){   // ヘルプ表示中はキー操作を遮断
    if(['Escape','?','h','H'].includes(e.key)) $('help').classList.remove('show');
    return;
  }
  const step = e.shiftKey?5 : (e.altKey?0.2 : 1);
  switch(e.key){
    case 'o': case 'O': fileInput.click(); break;
    case 'r': rotate(90); break;
    case 'R': rotate(-90); break;
    case 'f': case 'F': flip(); break;
    case 'z': case 'Z': case 'Backspace': e.preventDefault(); undo(); break;
    case 'c': case 'C': startC7(); break;
    case 's': case 'S': startScale(); break;
    case 'Enter': case 'e': case 'E': e.preventDefault(); recordAndNext(); break;
    case 'n': case 'N': navTo(state.index+1); break;
    case 'p': case 'P': navTo(state.index-1); break;
    case 'd': case 'D': saveCsv(); break;
    case '+': case '=': zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, 1.2); break;
    case '-': case '_': zoomAt(canvas.clientWidth/2, canvas.clientHeight/2, 1/1.2); break;
    case '0': fit(); render(); break;
    case 'ArrowLeft':  e.preventDefault(); nudge(-step,0); break;
    case 'ArrowRight': e.preventDefault(); nudge(step,0); break;
    case 'ArrowUp':    e.preventDefault(); nudge(0,-step); break;
    case 'ArrowDown':  e.preventDefault(); nudge(0,step); break;
    case '?': case 'h': case 'H': toggleHelp(); break;
    case 'Escape': if(state.scale.setting){ state.scale.setting=0; setStatus('校正中止'); } $('help').classList.remove('show'); break;
  }
});

function startC7(){
  if(!state.result){ setStatus('先にPI/PT/SS/LL計測を完了してください'); return; }
  state.placingC7=true;
  delete state.points.c7a; delete state.points.c7p;
  state.placedOrder=state.placedOrder.filter(id=>id!=='c7a'&&id!=='c7p');
  state.active=null;
  setStatus('C7前縁→C7後縁をクリック（SVA算出）'); updateUI(); render();
}
function startScale(){
  if(!state.bitmap) return;
  state.scale={ p1:null,p2:null,realMm:null,pxPerMm:null, setting:1 };
  recompute(); setStatus('スケール: 基準線の始点をクリック'); updateUI(); render();
}

//==================================================================
// UI 更新
//==================================================================
function setStatus(t){ $('status').textContent=t; }
function updateUI(){
  const has=!!state.bitmap;
  $('empty').style.display = has ? 'none' : 'flex';
  document.querySelectorAll('.dataonly').forEach(b=>b.disabled=!has);
  $('btnPrev').disabled=!has||state.index<=0;
  $('btnNext').disabled=!has||state.index>=state.images.length-1;
  const rec = has && state.rowByIndex[state.index]!==undefined;
  $('counter').textContent = has
    ? `画像 ${state.index+1} / ${state.images.length}` + (rec?' ✓記録済':'') + (hasUnsaved()?' ●未記録':'')
    : '画像なし';

  // 計測値
  const res=state.result, m=$('metrics');
  if(res){
    m.innerHTML = state.preset.metrics.map(mt=>
      `<div class="metric"><div class="k">${mt.key}</div><div class="v">${res[mt.key].toFixed(1)}${mt.unit}</div></div>`
    ).join('');
    const sv=$('svaInfo');
    if(res.svaPx!=null){
      sv.innerHTML = res.svaMm!=null
        ? `<b>SVA:</b> ${res.svaMm.toFixed(1)} mm <span style="color:#999">(${res.svaPx.toFixed(1)} px)</span>`
        : `<b>SVA:</b> ${res.svaPx.toFixed(1)} px <span style="color:#999">（mm換算はスケール校正が必要）</span>`;
    } else sv.innerHTML = `<span style="color:#999">SVA未計測（C入力でC7配置）</span>`;
  } else {
    m.innerHTML = `<div class="note" style="grid-column:1/3">必須点を配置すると計測値が表示されます。</div>`;
    $('svaInfo').innerHTML='';
  }

  // スケール表示
  const sc=state.scale, sb=$('scaleInfo');
  if(sc.pxPerMm){ sb.style.background='#fff3e0'; sb.style.border='1px solid #ffb74d';
    sb.innerHTML=`📏 スケール: ${sc.realMm.toFixed(1)}mm / ${sc.pxPerMm.toFixed(2)} px/mm`; }
  else { sb.style.background='#eee'; sb.style.border='1px solid #ccc';
    sb.innerHTML='📏 スケール未校正（SVAはpx表示）'; }

  // ステータス（校正中でなければ）
  if(sc.setting===0){
    const pid=pendingStepId();
    setStatus(pid ? `次: ${labelOf(pid)} をクリック（矢印キーで微調整）`
                  : '計測完了。Enter/Eで記録して次へ。点はドラッグで調整可。');
  }
}

//==================================================================
// 自己テスト（コンソールで runSelfTest() ）
//==================================================================
window.runSelfTest=function(){
  const near=(a,b,t=0.01,msg='')=>{ if(Math.abs(a-b)>t) throw new Error(`FAIL ${msg}: ${a} vs ${b}`); console.log('ok',msg,a.toFixed(3)); };
  // 水平S1終板, 鉛直骨盤線 → SS=0, PT=0, PI=0, LL=0
  let r=SPINOPELVIC.compute({femL:{x:0,y:200},femR:{x:100,y:200},
    s1a:{x:0,y:100},s1p:{x:100,y:100},l1a:{x:0,y:0},l1p:{x:100,y:0}});
  near(r.SS,0,0.01,'SS horizontal'); near(r.PT,0,0.01,'PT vertical');
  near(r.PI,0,0.01,'PI'); near(r.LL,0,0.01,'LL parallel');
  // 45°傾いたS1 → SS=45
  r=SPINOPELVIC.compute({femL:{x:0,y:200},femR:{x:100,y:200},
    s1a:{x:0,y:0},s1p:{x:100,y:100},l1a:{x:0,y:0},l1p:{x:100,y:0}});
  near(r.SS,45,0.01,'SS 45deg'); near(r.LL,45,0.01,'LL 45 vs 0');
  // SVA: C7中点 x=120, S1後縁 x=100 → 20px
  r=SPINOPELVIC.compute({femL:{x:0,y:300},femR:{x:100,y:300},
    s1a:{x:0,y:200},s1p:{x:100,y:200},l1a:{x:0,y:100},l1p:{x:100,y:100},
    c7a:{x:110,y:0},c7p:{x:130,y:0}}, 2);
  near(r.svaPx,20,0.01,'SVA px'); near(r.svaMm,10,0.01,'SVA mm');
  console.log('%c runSelfTest: ALL PASSED','color:green;font-weight:bold');
  return true;
};
